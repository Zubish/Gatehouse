<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Vibrant Blue Gradient for G Accent -->
    <linearGradient id="gateBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b7bfb" />
      <stop offset="100%" stop-color="#0052cc" />
    </linearGradient>

    <!-- Cyan Glow Gradient for Gate Bars -->
    <linearGradient id="gateBarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38ef7d" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#1b7bfb" stop-opacity="0.6" />
    </linearGradient>

    <!-- Subtle White Shading for Left Shield -->
    <linearGradient id="whiteShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
  </defs>

  <!-- SHIELD EMBLEM GROUP WITH CASTLE CRENELLATIONS -->
  <g id="gatehouse-shield">
    
    <!-- LEFT WHITE SHIELD HALF -->
    <path 
      d="M 170 130 
         L 210 130 L 210 145 L 250 145 L 250 130 
         L 250 360 L 250 360 L 170 290 
         Z" 
      fill="url(#whiteShieldGrad)" 
    />

    <!-- FULL OUTER CASTLE SHIELD SILHOUETTE -->
    <!-- Top crenellations: (170,130) -> (210,130) -> (210,145) -> (250,145) -> (250,130) -> (290,130) -> (290,145) -> (330,145) -> (330,130) -> (330,240) -> shield curve to (250,360) -> curve to (170,240) -> Z -->
    <path 
      d="M 170 130 
         H 210 V 145 H 290 V 130 H 330 V 240
         C 330 300, 290 340, 250 360
         C 210 340, 170 300, 170 240 
         Z" 
      fill="url(#whiteShieldGrad)"
    />

    <!-- INNER ARCHWAY CUTOUT (DARK HOLLOW ARCH) -->
    <path 
      d="M 195 240 
         C 195 200, 305 200, 305 240
         V 290 
         C 305 315, 280 330, 250 340
         C 220 330, 195 315, 195 290 
         Z" 
      fill="#0b172a"
    />

    <!-- VERTICAL GATE BARS INSIDE ARCHWAY -->
    <g id="gate-bars">
      <rect x="215" y="210" width="8" height="45" rx="4" fill="url(#gateBlueGrad)" opacity="0.85" />
      <rect x="231" y="202" width="8" height="53" rx="4" fill="url(#gateBlueGrad)" opacity="0.95" />
      <rect x="247" y="198" width="8" height="57" rx="4" fill="url(#gateBlueGrad)" />
      <rect x="263" y="202" width="8" height="53" rx="4" fill="url(#gateBlueGrad)" opacity="0.95" />
      <rect x="279" y="210" width="8" height="45" rx="4" fill="url(#gateBlueGrad)" opacity="0.85" />
    </g>

    <!-- BLUE 'G' LETTER MARK SWEEP ON RIGHT & BOTTOM -->
    <path 
      d="M 250 360 
         C 290 340, 330 300, 330 240
         H 255
         V 262
         H 305
         C 305 290, 280 320, 250 335
         Z" 
      fill="url(#gateBlueGrad)" 
    />

  </g>
</svg>
